# =============================================================================
# 演習用 PostgreSQL 設定
#
# 【重要】この設定は障害再現のための演習専用です。
#   - max_connections = 20 は意図的に小さくしています。
#   - TCP Keepalive はあえてOS既定値(idleが約2時間)のままにしています。
#     これにより「切断を検知できず接続が残留する」状態を再現します。
#     恒久対策(問6)で ALTER SYSTEM により短い値へ変更します。
# =============================================================================

# ---- 接続設定 ----
listen_addresses = '*'
port = 5432
max_connections = 20

# superuser予約枠(デフォルト値を明示)
# 一般ユーザー(appuser)が使えるのは実質 20 - 3 = 17 本。
# 管理用のpostgresユーザーは枯渇時もこの予約枠で接続できる。
superuser_reserved_connections = 3

# ---- TCP Keepalive(演習開始時はOS既定値 = 実質無効に近い) ----
# 0 はOSデフォルト使用の意味。Linux既定では idle=7200秒(2時間)。
# tcp_keepalives_idle = 0    # コメントアウト:ALTER SYSTEMで動的変更するため
# tcp_keepalives_interval = 0
# tcp_keepalives_count = 0

# ---- メモリ(Killercodaの小規模環境向けに控えめ) ----
shared_buffers = 64MB
work_mem = 2MB
maintenance_work_mem = 16MB

# ---- ログ(調査しやすさ重視) ----
logging_collector = off            # 標準エラー出力へ(docker logsで確認)
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] user=%u,db=%d,app=%a,client=%h '
log_min_messages = warning
log_min_error_statement = error

# ---- その他 ----
timezone = 'Asia/Tokyo'
datestyle = 'iso, ymd'
